<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kunru Che's 3D Space Portfolio - Full-Stack Developer & Vibe Coding Engineer">
    <meta name="keywords" content="portfolio, developer, full-stack, AI, React, Spring Boot">
    <meta name="author" content="Kunru Che">
    <meta property="og:title" content="Space Portfolio - Kunru Che">
    <meta property="og:description" content="Explore my projects in an interactive 3D solar system">
    <meta property="og:type" content="website">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
    <title>Space Portfolio - Kunru Che</title>
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader"></div>
        <p>Initializing Space...</p>
    </div>

    <!-- Language Switcher -->
    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <span class="lang-divider">|</span>
        <button class="lang-btn" data-lang="zh">中文</button>
    </div>

    <!-- Control Mode Switcher -->
    <div class="mode-switcher">
        <button class="mode-btn active" data-mode="orbit">
            <span class="icon">🌍</span>
            <span data-en="Orbit View" data-zh="轨道视角">Orbit View</span>
        </button>
        <button class="mode-btn" data-mode="spaceship">
            <span class="icon">🚀</span>
            <span data-en="Spaceship" data-zh="飞船模式">Spaceship</span>
        </button>
        <button class="mode-btn" data-mode="starmap">
            <span class="icon">📷</span>
            <span data-en="Star Map" data-zh="星图模式">Star Map</span>
        </button>
    </div>

    <!-- Star Map Labels Container -->
    <div id="starmap-labels" class="hidden"></div>

    <!-- Star Map Exit Button -->
    <button id="starmap-exit" class="hidden" data-en="Back to 3D" data-zh="返回3D">Back to 3D</button>

    <!-- Mini Map -->
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>

    <!-- Spaceship HUD -->
    <div id="spaceship-hud" class="hidden">
        <div class="hud-speed">
            <span data-en="Speed" data-zh="速度">Speed</span>: <span id="speed-value">0</span>
        </div>
        <div class="hud-coords">
            X: <span id="coord-x">0</span> |
            Y: <span id="coord-y">0</span> |
            Z: <span id="coord-z">0</span>
        </div>
        <div class="hud-controls">
            <span data-en="WASD: Move | Mouse: Look | Scroll: Speed" data-zh="WASD: 移动 | 鼠标: 视角 | 滚轮: 速度">WASD: Move | Mouse: Look | Scroll: Speed</span>
        </div>
    </div>

    <!-- Planet Info Panel -->
    <div id="planet-panel" class="hidden">
        <button class="close-btn">&times;</button>
        <div class="panel-header">
            <h2 id="panel-name"></h2>
            <span id="panel-badge" class="badge"></span>
        </div>
        <div id="panel-screenshot" class="panel-screenshot"></div>
        <p id="panel-desc"></p>
        <div class="panel-section">
            <h4 data-en="Tech Stack" data-zh="技术栈">Tech Stack</h4>
            <div id="panel-tech"></div>
        </div>
        <div class="panel-section">
            <h4 data-en="Timeline" data-zh="开发历程">Timeline</h4>
            <div id="panel-timeline"></div>
        </div>
        <a id="panel-github" class="btn" target="_blank">
            <span class="btn-icon">⬡</span>
            <span data-en="View on GitHub" data-zh="查看GitHub">View on GitHub</span>
        </a>
    </div>

    <!-- Hover Label -->
    <div id="hover-label" class="hidden"></div>

    <!-- Developer Panel -->
    <div id="developer-panel" class="hidden">
        <button class="close-btn" onclick="UI.hideDeveloperPanel()">&times;</button>
        <div class="panel-header">
            <h2 id="dev-name"></h2>
            <span class="badge">Developer</span>
        </div>
        <p id="dev-desc"></p>
        <div class="panel-section">
            <h4 data-en="Skills" data-zh="技能">Skills</h4>
            <canvas id="skills-canvas"></canvas>
        </div>
        <div class="panel-section">
            <h4 data-en="Contact" data-zh="联系方式">Contact</h4>
            <a id="dev-email" class="contact-link" href="#">email</a>
        </div>
        <div class="panel-buttons">
            <a id="dev-github" class="btn" href="https://github.com/ckr-git" target="_blank">
                <span>⬡</span> GitHub
            </a>
            <a id="dev-resume" class="btn" href="#" target="_blank">
                <span>📄</span> <span data-en="Resume" data-zh="简历">Resume</span>
            </a>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- App Scripts -->
    <script src="js/scene.js?v=3"></script>
    <script src="js/planets.js?v=3"></script>
    <script src="js/controls.js?v=3"></script>
    <script src="js/spaceship.js?v=3"></script>
    <script src="js/ui.js?v=3"></script>
    <script src="js/tutorial.js?v=3"></script>
    <script src="js/main.js?v=3"></script>
</body>
</html>
