<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Portfolio - 3D Solar System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading">
        <div class="loader"></div>
        <p>Initializing Space...</p>
    </div>

    <!-- Language Switcher -->
    <div class="lang-switcher">
        <button class="lang-btn active" data-lang="en">EN</button>
        <span class="lang-divider">|</span>
        <button class="lang-btn" data-lang="zh">中文</button>
    </div>

    <!-- Control Mode Switcher -->
    <div class="mode-switcher">
        <button class="mode-btn active" data-mode="orbit">
            <span class="icon">🌍</span>
            <span data-en="Orbit View" data-zh="轨道视角">Orbit View</span>
        </button>
        <button class="mode-btn" data-mode="spaceship">
            <span class="icon">🚀</span>
            <span data-en="Spaceship" data-zh="飞船模式">Spaceship</span>
        </button>
    </div>

    <!-- Mini Map -->
    <div id="minimap">
        <canvas id="minimap-canvas"></canvas>
    </div>

    <!-- Spaceship HUD -->
    <div id="spaceship-hud" class="hidden">
        <div class="hud-speed">
            <span data-en="Speed" data-zh="速度">Speed</span>: <span id="speed-value">0</span>
        </div>
        <div class="hud-coords">
            X: <span id="coord-x">0</span> |
            Y: <span id="coord-y">0</span> |
            Z: <span id="coord-z">0</span>
        </div>
        <div class="hud-controls">
            <span data-en="WASD: Move | Mouse: Look | Scroll: Speed" data-zh="WASD: 移动 | 鼠标: 视角 | 滚轮: 速度">WASD: Move | Mouse: Look | Scroll: Speed</span>
        </div>
    </div>

    <!-- Planet Info Panel -->
    <div id="planet-panel" class="hidden">
        <button class="close-btn">&times;</button>
        <div class="panel-header">
            <h2 id="panel-name"></h2>
            <span id="panel-badge" class="badge"></span>
        </div>
        <p id="panel-desc"></p>
        <div class="panel-section">
            <h4 data-en="Tech Stack" data-zh="技术栈">Tech Stack</h4>
            <div id="panel-tech"></div>
        </div>
        <div class="panel-section">
            <h4 data-en="Timeline" data-zh="开发历程">Timeline</h4>
            <div id="panel-timeline"></div>
        </div>
        <a id="panel-github" class="btn" target="_blank">
            <span class="btn-icon">⬡</span>
            <span data-en="View on GitHub" data-zh="查看GitHub">View on GitHub</span>
        </a>
    </div>

    <!-- Hover Label -->
    <div id="hover-label" class="hidden"></div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- App Scripts -->
    <script src="js/scene.js"></script>
    <script src="js/planets.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/spaceship.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
